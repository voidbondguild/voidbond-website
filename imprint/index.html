<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />

  <title>Impressum</title>

  <style>

      line-height: 1.6;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      color: #222;
      background: #fff;

      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    h1, h2 {
      color: #111;
    }

    h1 {
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
    }

    .section {
      margin-bottom: 25px;
    }

    footer {
      margin-top: auto;
      width: 100%;
      text-align: center;
      font-size: 12px;
      color: #aaa;
      background: #000;
      padding: 10px 0;
    }

    footer a {
      color: #aaa;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <h1>Impressum</h1>

  <div class="section">
    <p>
      [Vollständiger Name]<br />
      [Straße und Hausnummer]<br />

  </div>

</html>
