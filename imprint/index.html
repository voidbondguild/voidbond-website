<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Impressum</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      color: #222;
      background: #fff;

      padding-bottom: 120px; /* Platz für Footer */
    }

    h1 {
      font-weight: 800;
      font-size: 36px;
      color: #111;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
    }

    .section {
      margin-bottom: 25px;
    }

    /* FULL WIDTH FIXED FOOTER */
    footer {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100vw;
      height: 80px;              /* doppelte Höhe */
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    footer a {
      color: #aaa;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <h1>Impressum</h1>

  <div class="section">
    <p>
      [Vollständiger Name]<br />
      [Straße und Hausnummer]<br />
      [PLZ Ort]<br />
      Deutschland<br /><br />
      E-Mail: hi@voidbond.com
    </p>
  </div>

  <footer>
    <a href="https://voidbond.com/imprint">Impressum</a>
  </footer>

</body>
</html>
